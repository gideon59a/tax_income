<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Parameter Input</title>
</head>
<body>
    // The body includes the page as presented when  entering the main url.
    // The body contains just the user inputs

    <h2>Income Tax Calculation</h2>

    <label>Year: <input type="number" id="val2" value="{{ default2 }}"></label>
    <br><br>

    <label>Yearly income (integer): <input type="number" id="val4" value="{{ default4 }}"></label>
    <br><br>

    <label>A pension age (boolean):
        <select id="at_pension_age">
            <option value="True" {% if pension_age=="True" %} selected{% endif %}>True</option>
            <option value="False" {% if pension_age=="False" %}selected{% endif %}>False</option>
        </select>
    </label>
    <br><br>

    <button onclick="sendData()">Submit (calculate)</button>
    <br><br>
    <div id="output"></div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>

</html>
